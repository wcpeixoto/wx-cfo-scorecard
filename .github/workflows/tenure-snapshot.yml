# Weekly Wodify retention snapshot with a bounded, paged student census.
#
# Each mode=page request fetches exactly one /clients page and stores only
# aggregate counters. The terminal page is discovered from hasMore=false; no
# page or active-client total is projected. mode=finalize independently rebuilds
# the existing retention aggregate and writes one final row only after every
# conservation gate passes.
#
# The Action carries only invocation credentials. WODIFY_API_KEY and
# SUPABASE_SERVICE_ROLE_KEY remain inside the Edge Function.

name: Tenure Snapshot Clock

"on":
  schedule:
    - cron: '0 12 * * 1'
  workflow_dispatch:
    inputs:
      page_one_only:
        description: 'Diagnose page 1 once; never continue or finalize'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: wodify-retention-census
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Diagnose page one only
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.page_one_only }}
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SYNC_TRIGGER_SECRET: ${{ secrets.SYNC_TRIGGER_SECRET }}
        run: |
          set -euo pipefail
          RUN_ID=$(cat /proc/sys/kernel/random/uuid)
          jq -nc --arg run_id "$RUN_ID" '{mode:"page", run_id:$run_id, page:1}' > request.json
          # Capture the body privately. No curl/parser error text reaches logs.
          if ! HTTP_STATUS=$(curl --connect-timeout 10 --max-time 65 -s -X POST \
            "$VITE_SUPABASE_URL/functions/v1/sync-wodify-retention" \
            -H "Authorization: Bearer $VITE_SUPABASE_ANON_KEY" \
            -H "apikey: $VITE_SUPABASE_ANON_KEY" \
            -H "x-sync-trigger-secret: $SYNC_TRIGGER_SECRET" \
            -H "Content-Type: application/json" \
            --data-binary @request.json -o page-response.json \
            --write-out '%{http_code}' 2>/dev/null); then
            echo '{"error":"page_transport_failed"}'
            exit 1
          fi
          if [ "$HTTP_STATUS" != "200" ]; then
            if jq -ce '
              def count: type == "number" and . >= 0 and . <= 9007199254740991 and floor == .;
              select(type == "object" and .error == "page_classification_failed")
              | {error: "page_classification_failed", unclassified_total, detail_clients_failed,
                 unclassified_reasons: (.unclassified_reasons | {
                   invalid_detail_record, invalid_no_group_signins, invalid_group_or_missing_role,
                   unrecognized_group_role, invalid_guardian_signins, invalid_client_id, detail_fetch_failed
                 }),
                 detail_http_status_counts: (.detail_http_status_counts
                   | with_entries(select(.key | test("^[1-5][0-9]{2}$"))))}
              | select((.unclassified_total | count) and (.detail_clients_failed | count)
                and (.unclassified_reasons | all(.[]; count))
                and (.detail_http_status_counts | all(.[]; count)))
            ' page-response.json > page-diagnostic.json 2>/dev/null; then
              cat page-diagnostic.json
            else
              echo '{"error":"invalid_page_diagnostic"}'
            fi
            exit 1
          fi
          # Only the existing aggregate page-summary fields may reach stdout.
          if jq -ce '
            def count: type == "number" and . >= 0 and . <= 9007199254740991 and floor == .;
            select(type == "object" and .ok == true and .mode == "page")
            | {page, pageSize, hasMore, rowsSeen, activeClientsSeen, studentTotal,
               guardianOnly, unclassified, detailCallsMade, detailClientsFailed}
            | select(.page == 1 and .pageSize == 25 and (.hasMore | type) == "boolean"
              and ([.rowsSeen, .activeClientsSeen, .studentTotal, .guardianOnly,
                    .unclassified, .detailCallsMade, .detailClientsFailed] | all(.[]; count))
              and .rowsSeen <= 25 and .rowsSeen >= .activeClientsSeen
              and .activeClientsSeen == (.studentTotal + .guardianOnly + .unclassified)
              and .unclassified == 0 and .detailClientsFailed == 0)
          ' page-response.json > page-diagnostic.json 2>/dev/null; then
            cat page-diagnostic.json
            exit 0
          fi
          echo '{"error":"invalid_page_summary"}'
          exit 1

      - name: Build paged census and finalize snapshot
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.page_one_only) }}
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SYNC_TRIGGER_SECRET: ${{ secrets.SYNC_TRIGGER_SECRET }}
        run: |
          set -euo pipefail
          RUN_ID=$(cat /proc/sys/kernel/random/uuid)
          PAGE=1

          while true; do
            STARTED_AT=$(date +%s)
            jq -nc --arg run_id "$RUN_ID" --argjson page "$PAGE" \
              '{mode:"page", run_id:$run_id, page:$page}' > request.json

            curl --fail-with-body --connect-timeout 10 --max-time 65 -sS -X POST \
              "$VITE_SUPABASE_URL/functions/v1/sync-wodify-retention" \
              -H "Authorization: Bearer $VITE_SUPABASE_ANON_KEY" \
              -H "apikey: $VITE_SUPABASE_ANON_KEY" \
              -H "x-sync-trigger-secret: $SYNC_TRIGGER_SECRET" \
              -H "Content-Type: application/json" \
              --data-binary @request.json \
              -o page-response.json

            ELAPSED=$(( $(date +%s) - STARTED_AT ))
            jq -e --argjson page "$PAGE" \
              '.ok == true
               and .mode == "page"
               and .page == $page
               and .pageSize == 25
               and (.hasMore | type) == "boolean"
               and (.studentsByPath | type) == "object"
               and (.studentsByPath | length) == 4
               and (.studentsByPath | has("member"))
               and (.studentsByPath | has("dependent"))
               and (.studentsByPath | has("guardian_with_signin"))
               and (.studentsByPath | has("no_group_with_signin"))
               and .rowsSeen >= .activeClientsSeen
               and .activeClientsSeen == (.studentTotal + .guardianOnly + .unclassified)
               and .studentTotal == ([.studentsByPath[]] | add)
               and .unclassified == 0
               and .detailClientsFailed == 0' \
              page-response.json > /dev/null
            echo "Page $(jq -c '{page, pageSize, hasMore, rowsSeen, activeClientsSeen, studentTotal, guardianOnly, unclassified, detailCallsMade, detailClientsFailed}' page-response.json) elapsed=${ELAPSED}s"

            if [ "$ELAPSED" -ge 100 ]; then
              echo "Page exceeded the 100s stop threshold; finalize was not called" >&2
              exit 1
            fi
            if [ "$ELAPSED" -ge 60 ]; then
              echo "Page missed the under-60s acceptance gate; finalize was not called" >&2
              exit 1
            fi

            HAS_MORE=$(jq -r '.hasMore' page-response.json)
            if [ "$HAS_MORE" = "false" ]; then
              break
            fi

            PAGE=$((PAGE + 1))
            if [ "$PAGE" -gt 200 ]; then
              echo "Safety page cap reached without a terminal page; finalize was not called" >&2
              exit 1
            fi
          done

          jq -nc --arg run_id "$RUN_ID" \
            '{mode:"finalize", run_id:$run_id}' > request.json
          curl --fail-with-body --connect-timeout 10 --max-time 65 -sS -X POST \
            "$VITE_SUPABASE_URL/functions/v1/sync-wodify-retention" \
            -H "Authorization: Bearer $VITE_SUPABASE_ANON_KEY" \
            -H "apikey: $VITE_SUPABASE_ANON_KEY" \
            -H "x-sync-trigger-secret: $SYNC_TRIGGER_SECRET" \
            -H "Content-Type: application/json" \
            --data-binary @request.json \
            -o response.json
          echo "Finalize ok: $(jq -c '{ok, asOf, activeTotal, studentTotal, guardianOnlyTotal, unclassifiedTotal, pagesExpected, pagesCompleted}' response.json)"

      - name: Assert finalize response
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.page_one_only) }}
        run: |
          set -euo pipefail
          jq -e \
            '.ok == true
             and .mode == "finalize"
             and .activeTotal > 0
             and .dataQuality.reachedPageCap == false
             and (.studentsByPath | type) == "object"
             and (.studentsByPath | length) == 4
             and .studentTotal == ([.studentsByPath[]] | add)
             and .studentTotal + .guardianOnlyTotal + .unclassifiedTotal == .activeTotal
             and .unclassifiedTotal == 0
             and .detailClientsFailed == 0
             and .pagesExpected == .pagesCompleted
             and .pagesCompleted > 0' \
            response.json > /dev/null
          echo "Finalize asserts passed: $(jq -c '{activeTotal, studentTotal, guardianOnlyTotal, unclassifiedTotal, detailClientsFailed, pagesExpected, pagesCompleted}' response.json)"

      - name: Read back complete persisted snapshot
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.page_one_only) }}
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          ASOF=$(jq -r '.asOf' response.json)
          curl --fail-with-body --connect-timeout 10 --max-time 30 -sS \
            "$VITE_SUPABASE_URL/rest/v1/wodify_retention_aggregate?select=workspace_id,source,as_of,fetched_at,active_total,inactive_total,days_absent_histogram,tenure_band_histogram,cohort_histogram,unknown_count,monthly_dues_at_risk,missing_monthly_dues,silent_dues_snapshot,wodify_at_risk_count,unknown_status,future_last_check_in,pages_fetched,reached_page_cap,clients_scanned,student_total,guardian_only_total,students_by_path,unclassified_total,ambiguous_no_signin_with_membership,detail_calls_made,detail_clients_failed,pages_expected,pages_completed,student_retention&workspace_id=eq.default&as_of=eq.$ASOF&limit=1" \
            -H "apikey: $VITE_SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $VITE_SUPABASE_ANON_KEY" \
            -o readback.json

          jq -e --arg asof "$ASOF" --slurpfile response response.json \
            'def stamp:
               sub("\\+00:00$"; "Z")
               | capture("^(?<whole>[^.]+?)(?:\\.(?<fraction>[0-9]+))?Z$")
               | .whole + "." + ((.fraction // "") | sub("0+$"; ""));
             .[0] as $row
             | $response[0] as $sent
             | $row.as_of == $asof
             and $row.workspace_id == "default"
             and $row.source == "wodify"
             and ($row.fetched_at | type) == "string"
             and ($row.fetched_at | stamp) == ($sent.fetchedAt | stamp)
             and $row.active_total == $sent.activeTotal
             and $row.active_total > 0
             and ($row.inactive_total | type) == "number"
             and ($row.days_absent_histogram | type) == "object"
             and ($row.tenure_band_histogram | type) == "object"
             and ($row.cohort_histogram | type) == "object"
             and ($row.unknown_count | type) == "number"
             and ($row | has("monthly_dues_at_risk"))
             and (($row.monthly_dues_at_risk | type) == "null" or ($row.monthly_dues_at_risk | type) == "number")
             and ($row | has("silent_dues_snapshot"))
             and (($row.silent_dues_snapshot | type) == "null" or ($row.silent_dues_snapshot | type) == "object")
             and ($row.missing_monthly_dues | type) == "boolean"
             and ($row.wodify_at_risk_count | type) == "number"
             and ($row.unknown_status | type) == "number"
             and ($row.future_last_check_in | type) == "number"
             and ($row.pages_fetched | type) == "number"
             and $row.reached_page_cap == false
             and ($row.clients_scanned | type) == "number"
             and $row.student_retention.version == 1
             and $row.student_retention.asOf == $asof
             and $row.student_retention.studentTotal == $row.student_total
             and $row.student_total == $sent.studentTotal
             and $row.guardian_only_total == $sent.guardianOnlyTotal
             and $row.unclassified_total == 0
             and ($row.ambiguous_no_signin_with_membership | type) == "number"
             and ($row.detail_calls_made | type) == "number"
             and $row.detail_clients_failed == 0
             and $row.pages_expected == $sent.pagesExpected
             and $row.pages_completed == $sent.pagesCompleted
             and ($row.students_by_path | type) == "object"
             and ($row.students_by_path | length) == 4
             and ($row.students_by_path | has("member"))
             and ($row.students_by_path | has("dependent"))
             and ($row.students_by_path | has("guardian_with_signin"))
             and ($row.students_by_path | has("no_group_with_signin"))
             and $row.student_total == ([$row.students_by_path[]] | add)
             and $row.student_total + $row.guardian_only_total + $row.unclassified_total == $row.active_total' \
            readback.json > /dev/null
          echo "Read-back confirmed: complete existing aggregate plus paged student census for as_of=$ASOF"
